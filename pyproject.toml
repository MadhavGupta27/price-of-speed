[project]
name = "orpaper"
version = "0.1.0"
description = "OR group project: bibliometric review + optimisation case study"
requires-python = ">=3.11"
dependencies = [
    "pulp>=2.8,<3",
    "highspy>=1.7",
    "pandas>=2.2",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "requests>=2.31",
    "rasterio>=1.4.4",
    "shapely>=2.1.2",
    "osmium>=4.3.1",
    "pycountry>=26.2.16",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/orpaper"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
